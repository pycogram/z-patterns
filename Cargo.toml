[package]
name = "patterns"
version = "0.1.0"
edition = "2021"
authors = ["rustyai <devrustyai@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Organizational patterns and architectures for multi-agent systems"
repository = "https://github.com/rustyai/patterns"
documentation = "https://docs.rs/patterns"
keywords = ["agents", "patterns", "multi-agent", "organization", "coordination"]
categories = ["simulation", "algorithms"]
readme = "README.md"

[dependencies]
agent-core = { path = "../agent-core" }
messaging = { path = "../messaging" }
cognition = { path = "../cognition" }
runtime = { path = "../runtime" }

async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"

