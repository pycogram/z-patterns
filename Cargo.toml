[package]
name = "z-patterns"
version = "0.1.0"
edition = "2021"
authors = ["zeroicai <devzeroicai@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Organizational patterns and architectures for multi-agent systems"
repository = "https://github.com/zeroicai/z-patterns"
documentation = "https://docs.rs/z-patterns"
keywords = ["agents", "patterns", "multi-agent", "organization", "coordination"]
categories = ["simulation", "algorithms"]
readme = "README.md"

[dependencies]
z-core = { git = "https://github.com/zeroicai/z-core", branch = "main" }
z-messaging = { git = "https://github.com/zeroicai/z-messaging", branch = "main" }
z-cognition = { git = "https://github.com/zeroicai/z-cognition", branch = "main" }
z-runtime = { git = "https://github.com/ZeroicAI/z-runtime", branch = "main" }

async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"

