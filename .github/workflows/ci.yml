name: CI

on:
  push:
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        path: patterns
    
    # Checkout dependencies as siblings
    - name: Checkout agent-core
      uses: actions/checkout@v3
      with:
        repository: RustyAI/agent-core
        path: agent-core
    
    - name: Checkout messaging
      uses: actions/checkout@v3
      with:
        repository: RustyAI/messaging
        path: messaging
    
    - name: Checkout cognition
      uses: actions/checkout@v3
      with:
        repository: RustyAI/cognition
        path: cognition
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: patterns
    
    - name: Check formatting
      working-directory: patterns
      run: cargo fmt --all -- --check
    
    - name: Build
      working-directory: patterns
      run: cargo build --verbose
    
    - name: Run Clippy
      working-directory: patterns
      run: cargo clippy --all-targets --all-features -- -D warnings
    
    - name: Run tests
      working-directory: patterns
      run: cargo test --verbose
    
    - name: Run examples
      working-directory: patterns
      run: |
        cargo run --example hierarchy_example
        cargo run --example swarm_example
        cargo run --example market_example
        cargo run --example coalition_example
        cargo run --example blackboard_example

  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo test --verbose

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo test --verbose